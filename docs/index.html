<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My IPA Store</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e7ecfa;background:#101729}body{max-width:900px;margin:30px auto;padding:0 16px}h1{font-size:28px}p,small{color:#aebdd8;line-height:1.6}a{color:#9cbcff}button,a.download{background:#426ce3;color:white;border:0;padding:11px 15px;border-radius:9px;text-decoration:none;cursor:pointer}input{width:100%;box-sizing:border-box;background:#202e47;color:white;border:1px solid #455676;padding:13px;border-radius:8px;margin:15px 0}article{display:flex;align-items:center;gap:13px;background:#1b2840;border:1px solid #384560;margin:12px 0;padding:16px;border-radius:12px}article img{width:54px;height:54px;object-fit:contain;border-radius:12px}.details{flex:1;min-width:0}h3{margin:0}code{overflow-wrap:anywhere}
</style></head><body><h1>My IPA Store</h1><p>私人使用的 IPA 目录 · GitHub Releases 托管</p><button id="copy">复制软件源地址</button><p>AltStore Classic 风格 JSON：<code id="url"></code></p><input id="q" placeholder="搜索名称 / 包名 / 版本" aria-label="搜索应用"><main id="list">加载中…</main><p>公开仓库的 IPA 对所有人可见。并非每款签名工具均支持此 JSON 格式；大陆直连 GitHub 下载不保证稳定。</p><script>
const url=new URL('./source.json',location.href).href;document.querySelector('#url').textContent=url;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);alert('已复制')}catch{prompt('复制链接',url)}};
let apps=[];const list=document.querySelector('#list');function render(){list.replaceChildren();const q=document.querySelector('#q').value.toLowerCase();const found=apps.filter(a=>[a.name,a.bundleIdentifier,...(a.versions||[]).map(v=>v.version)].join(' ').toLowerCase().includes(q));if(!found.length){list.textContent=apps.length?'没有搜索结果':'暂无应用，请通过 GitHub Actions 导入 IPA';return}for(const a of found){const v=(a.versions||[])[0];const row=document.createElement('article'),im=document.createElement('img'),box=document.createElement('div'),h=document.createElement('h3'),meta=document.createElement('small'),p=document.createElement('p');box.className='details';im.src=a.iconURL||'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png';im.alt='应用图标';h.textContent=a.name;meta.textContent=[v?.version,a.bundleIdentifier,v?Math.round(v.size/1048576)+' MB':''].filter(Boolean).join(' · ');p.textContent=a.localizedDescription||'';box.append(h,meta,p);row.append(im,box);if(v?.downloadURL?.startsWith('https://')){const l=document.createElement('a');l.href=v.downloadURL;l.className='download';l.rel='noopener noreferrer';l.textContent='下载 IPA';row.append(l)}list.append(row)}}
document.querySelector('#q').oninput=render;fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{apps=d.apps||[];render()}).catch(e=>list.textContent='加载失败：'+e.message);
</script></body></html>
